name: Assemble Catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-assemble
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Assemble catalog
        run: node scripts/catalog/assemble.js

      - name: Commit catalog
        if: success()
        run: |
          git add data/catalog.json data/catalogs/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: assemble catalog - $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push
