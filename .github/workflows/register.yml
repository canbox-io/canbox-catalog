name: Register APP

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub 仓库地址（https://github.com/owner/repo）'
        required: true
        type: string
      issue_number:
        description: '关联 Issue 编号（可选，仅用于回执）'
        required: false
        type: string

permissions:
  contents: write
  issues: write

# 与 discover/verify/reconcile/rediscover/assemble 共用同一并发组
concurrency:
  group: catalog-data-write
  cancel-in-progress: false

jobs:
  register:
    # 标签或标题前缀均可命中；标签缺失时 Issue 表单仍能触发
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.labels.*.name, 'app-registration') ||
        startsWith(github.event.issue.title, '[登记]')
      ))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canbox-catalog-data
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-catalog-data
          path: canbox-catalog-data
          token: ${{ secrets.CATALOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org/

      # 只提取 URL 与元信息，不把 Issue 内容传进 run:，避免脚本注入
      - name: Resolve registration input
        id: input
        uses: actions/github-script@v7
        with:
          script: |
            const repoPattern = /https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/;
            let repoUrl = '';
            let issueNumber = '';
            let actor = context.actor || '';

            if (context.eventName === 'workflow_dispatch') {
              repoUrl = String(context.payload.inputs?.repo_url || '').trim();
              issueNumber = String(context.payload.inputs?.issue_number || '').trim();
            } else {
              const body = String(context.payload.issue?.body || '');
              const match = body.match(repoPattern);
              repoUrl = match ? match[0] : '';
              issueNumber = String(context.payload.issue?.number || '');
              actor = context.payload.issue?.user?.login || actor;
            }

            const normalized = repoUrl.replace(/\.git$/i, '').replace(/\/+$/, '');
            const valid = /^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(normalized);
            core.setOutput('repo_url', valid ? normalized : '');
            core.setOutput('issue_number', issueNumber);
            core.setOutput('actor', actor);

      - name: Register APP
        id: register
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ steps.input.outputs.repo_url }}
          ISSUE_NUMBER: ${{ steps.input.outputs.issue_number }}
          ACTOR: ${{ steps.input.outputs.actor }}
        run: node scripts/github/register.js --platform=github --data-repo-root=./canbox-catalog-data

      - name: Read result
        id: result
        if: always()
        run: |
          if [ -f canbox-catalog-data/.register-result.json ]; then
            node -e "const r=require('./canbox-catalog-data/.register-result.json'); console.log('ok='+r.ok); console.log('close='+r.closeIssue)" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "close=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        id: commit
        if: steps.result.outputs.ok == 'true'
        run: |
          cd canbox-catalog-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: catalog register - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push

      - name: Reply on issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = './canbox-catalog-data/.register-result.json';
            let result = {
              ok: false,
              reason: 'system_error',
              message: '登记任务异常结束，未生成结果。请查看 Actions 日志，或稍后重新提交。',
              closeIssue: false
            };
            if (fs.existsSync(path)) {
              result = JSON.parse(fs.readFileSync(path, 'utf8'));
            }

            // 数据已写入但 push 失败时，不能对用户报「成功」
            if (result.ok && process.env.COMMIT_OUTCOME !== 'success') {
              result = {
                ok: false,
                reason: 'system_error',
                message: '目录数据已生成，但提交到 canbox-catalog-data 失败。请维护者查看 Actions 日志后重跑登记。',
                closeIssue: false
              };
            }

            const heading = result.ok
              ? '### ✅ 登记成功'
              : (result.reason === 'system_error' ? '### ⚠️ 登记未完成' : '### ❌ 登记未通过');
            const footer = result.ok
              ? '\n\n---\n<sub>目录数据已更新，pages 通常 1–5 分钟内可见；manager 在下次刷新目录后可见。再次登记同一仓库不会产生重复条目。</sub>'
              : '\n\n---\n<sub>本 Issue 由 register workflow 自动处理。修正后请重新提交登记。</sub>';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `${heading}\n\n${result.message || ''}${footer}`
            });

            if (result.closeIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed',
                state_reason: result.ok ? 'completed' : 'not_planned'
              });
            }
