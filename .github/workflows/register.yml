name: Register APP

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      repo_url:
        description: '仓库地址（https://github.com/owner/repo 或 https://gitee.com/owner/repo）'
        required: true
        type: string
      issue_number:
        description: '关联 Issue 编号（可选，仅用于回执）'
        required: false
        type: string
      approved:
        description: '维护者审核通过标记（Gitee 仓库必须为 true）'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  issues: write

# 用户触发的登记不能与定时任务共用并发组：同组只有 1 个运行位 + 1 个等待位，
# discover（每小时）/ verify（每 2 小时）会把等待中的登记顶掉。
# 独立成组保证登记一定能跑，写入冲突交给下面的 commit 重试处理。
concurrency:
  group: catalog-data-write-register
  cancel-in-progress: false

jobs:
  register:
    # 标签或标题前缀均可命中；标签缺失时 Issue 表单仍能触发
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.labels.*.name, 'app-registration') ||
        startsWith(github.event.issue.title, '[登记]')
      ))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canbox-catalog-data
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-catalog-data
          path: canbox-catalog-data
          token: ${{ secrets.CATALOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org/

      # 只提取 URL 与元信息，不把 Issue 内容传进 run:，避免脚本注入
      - name: Resolve registration input
        id: input
        uses: actions/github-script@v7
        with:
          script: |
            const githubPattern = /https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/;
            const giteePattern = /https:\/\/gitee\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/;
            let repoUrl = '';
            let issueNumber = '';
            let actor = context.actor || '';

            if (context.eventName === 'workflow_dispatch') {
              repoUrl = String(context.payload.inputs?.repo_url || '').trim();
              issueNumber = String(context.payload.inputs?.issue_number || '').trim();
            } else {
              const body = String(context.payload.issue?.body || '');
              const match = body.match(githubPattern) || body.match(giteePattern);
              repoUrl = match ? match[0] : '';
              issueNumber = String(context.payload.issue?.number || '');
              actor = context.payload.issue?.user?.login || actor;
            }

            // workflow_dispatch 由维护者审核流程触发时，回查 Issue 作者作为提交人
            if (context.eventName === 'workflow_dispatch' && issueNumber) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(issueNumber)
                });
                actor = issue.user?.login || actor;
              } catch (err) {
                core.warning(`无法读取关联 Issue #${issueNumber}: ${err.message}`);
              }
            }

            const normalized = repoUrl.replace(/\.git$/i, '').replace(/\/+$/, '');
            let platform = '';
            if (/^https:\/\/github\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(normalized)) {
              platform = 'github';
            } else if (/^https:\/\/gitee\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(normalized)) {
              platform = 'gitee';
            }

            const approved = context.eventName === 'workflow_dispatch'
              ? String(context.payload.inputs?.approved || 'false').toLowerCase()
              : 'false';

            core.setOutput('repo_url', platform ? normalized : '');
            core.setOutput('platform', platform);
            core.setOutput('issue_number', issueNumber);
            core.setOutput('actor', actor);
            core.setOutput('approved', approved);

      # Gitee 无法像 GitHub 一样通过 topic + owner 交叉核验身份，首期走人工审核。
      # 维护者在 Issue 评论 /approve 后，由 approve workflow 以 approved=true 重新触发本流程。
      - name: Pending Gitee review
        id: pending
        if: steps.input.outputs.platform == 'gitee' && steps.input.outputs.approved != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number('${{ steps.input.outputs.issue_number }}');
            if (!issueNumber) return;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: '### ⏳ 等待维护者审核\n\n已收到 Gitee 仓库登记申请。由于 Gitee 缺少与 GitHub topic 等价的公开身份信号，首期采用人工审核：维护者在本 Issue 评论 `/approve` 后会自动校验并收录。'
            });

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['needs-review']
              });
            } catch (err) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-review',
                  color: 'fbca04',
                  description: '等待维护者审核'
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['needs-review']
                });
              } catch (labelErr) {
                core.warning(`添加 needs-review 标签失败: ${labelErr.message}`);
              }
            }

            core.setOutput('pending', 'true');

      - name: Register APP (GitHub)
        id: register_github
        if: steps.input.outputs.platform == 'github'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ steps.input.outputs.repo_url }}
          ISSUE_NUMBER: ${{ steps.input.outputs.issue_number }}
          ACTOR: ${{ steps.input.outputs.actor }}
        run: node scripts/github/register.js --platform=github --data-repo-root=./canbox-catalog-data

      - name: Register APP (Gitee)
        id: register_gitee
        if: steps.input.outputs.platform == 'gitee' && steps.input.outputs.approved == 'true'
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          REPO_URL: ${{ steps.input.outputs.repo_url }}
          ISSUE_NUMBER: ${{ steps.input.outputs.issue_number }}
          ACTOR: ${{ steps.input.outputs.actor }}
          REVIEW_APPROVED: 'true'
        run: node scripts/gitee/register.js --platform=gitee --data-repo-root=./canbox-catalog-data

      - name: Resolve result path
        id: result_path
        if: steps.pending.outputs.pending != 'true'
        run: |
          if [ "${{ steps.input.outputs.platform }}" = "gitee" ]; then
            echo "path=canbox-catalog-data/sources/gitee/.register-result.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=canbox-catalog-data/.register-result.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Read result
        id: result
        if: always() && steps.pending.outputs.pending != 'true'
        run: |
          RESULT_FILE="${{ steps.result_path.outputs.path }}"
          if [ -n "$RESULT_FILE" ] && [ -f "$RESULT_FILE" ]; then
            node -e "const r=require('./'+process.argv[1]); console.log('ok='+r.ok); console.log('close='+r.closeIssue)" "$RESULT_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "close=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        id: commit
        if: steps.result.outputs.ok == 'true'
        run: |
          cd canbox-catalog-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: catalog register - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # 与定时任务并发时 push 可能被拒，重试若干次；rebase 冲突则直接失败并回执
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase conflict on attempt $attempt"
              exit 1
            fi
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::push failed after 5 attempts"
          exit 1

      - name: Reply on issue
        if: always() && steps.pending.outputs.pending != 'true' && steps.input.outputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RESULT_FILE: ${{ steps.result_path.outputs.path }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = Number('${{ steps.input.outputs.issue_number }}');
            if (!issueNumber) return;

            let result = {
              ok: false,
              reason: 'system_error',
              message: '登记任务异常结束，未生成结果。请查看 Actions 日志，或稍后重新提交。',
              closeIssue: false
            };
            if (process.env.RESULT_FILE && fs.existsSync(process.env.RESULT_FILE)) {
              result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'));
            }

            // 数据已写入但 push 失败时，不能对用户报「成功」
            if (result.ok && process.env.COMMIT_OUTCOME !== 'success') {
              result = {
                ok: false,
                reason: 'system_error',
                message: '目录数据已生成，但提交到 canbox-catalog-data 失败。请维护者查看 Actions 日志后重跑登记。',
                closeIssue: false
              };
            }

            const heading = result.ok
              ? '### ✅ 登记成功'
              : (result.reason === 'system_error' ? '### ⚠️ 登记未完成' : '### ❌ 登记未通过');
            const footer = result.ok
              ? '\n\n---\n<sub>目录数据已更新，pages 通常 1–5 分钟内可见；manager 在下次刷新目录后可见。再次登记同一仓库不会产生重复条目。</sub>'
              : '\n\n---\n<sub>本 Issue 由 register workflow 自动处理。修正后请重新提交登记。</sub>';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `${heading}\n\n${result.message || ''}${footer}`
            });

            if (result.closeIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: result.ok ? 'completed' : 'not_planned'
              });
            }
