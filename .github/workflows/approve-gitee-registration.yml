name: Approve Gitee Registration

# Gitee 仓库首期采用人工审核：维护者在登记 Issue 评论 /approve 后，
# 由本 workflow 校验权限并重新触发 register.yml（approved=true）。

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  approve:
    if: |
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/approve') &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.body, 'gitee.com')
    runs-on: ubuntu-latest
    steps:
      - name: Check permission and extract repo URL
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;

            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            const allowed = ['admin', 'maintain', 'write'];
            if (!allowed.includes(permission.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `@${context.actor} 没有审核权限，只有仓库协作者可执行 \`/approve\`。`
              });
              core.setOutput('allowed', 'false');
              return;
            }

            const body = String(issue.body || '');
            const match = body.match(/https:\/\/gitee\.com\/[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/);
            if (!match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '未在 Issue 中找到 Gitee 仓库地址，无法审核。请确认登记内容。'
              });
              core.setOutput('allowed', 'false');
              return;
            }

            core.setOutput('allowed', 'true');
            core.setOutput('repo_url', match[0].replace(/\.git$/i, '').replace(/\/+$/, ''));
            core.setOutput('issue_number', String(issueNumber));

      - name: Dispatch register workflow
        if: steps.check.outputs.allowed == 'true'
        uses: actions/github-script@v7
        env:
          REPO_URL: ${{ steps.check.outputs.repo_url }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        with:
          script: |
            const repoUrl = process.env.REPO_URL;
            const issueNumber = process.env.ISSUE_NUMBER;
            const defaultBranch = context.payload.repository.default_branch || 'main';

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'register.yml',
              ref: defaultBranch,
              inputs: {
                repo_url: repoUrl,
                issue_number: issueNumber,
                approved: 'true'
              }
            });

            // 审核通过后移除待审核标签，处理结果由 register workflow 回执
            const issue_number = Number(issueNumber);
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: 'needs-review'
              });
            } catch (err) {
              core.warning(`移除 needs-review 标签失败: ${err.message}`);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '### ✅ 审核通过\n\n已触发登记流程，稍后会在本 Issue 回执处理结果。'
            });
