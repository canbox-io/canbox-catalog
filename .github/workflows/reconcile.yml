name: Reconcile APP Topics

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run reconciliation
        id: reconcile
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/catalog/reconcile.js
          NEW_COUNT=$(cat data/.reconcile-result.json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).newCount))" || echo "0")
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: success()
        run: |
          git add data/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: catalog reconcile - $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push

      - name: Trigger assemble
        if: steps.reconcile.outputs.new_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'assemble.yml',
              ref: 'main'
            });
