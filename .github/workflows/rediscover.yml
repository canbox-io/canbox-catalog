name: Rediscover Early APPs

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 所有写 catalog-data 的 workflow 共享同一个并发组，避免互相覆盖分片
concurrency:
  group: catalog-data-write
  cancel-in-progress: false

jobs:
  rediscover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canbox-catalog-data
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-catalog-data
          path: canbox-catalog-data
          token: ${{ secrets.CATALOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org/

      - name: Run rediscovery
        id: rediscover
        env:
          GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/github/rediscover.js --platform=github --data-repo-root=./canbox-catalog-data
          NEW_COUNT=$(cat ./canbox-catalog-data/.rediscover-result.json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).newCount))" || echo "0")
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: success()
        run: |
          cd canbox-catalog-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: catalog rediscover - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push

      - name: Trigger assemble
        if: steps.rediscover.outputs.new_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'assemble.yml',
              ref: 'main'
            });