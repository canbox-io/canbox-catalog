name: Assemble Catalog

on:
  workflow_dispatch:

concurrency:
  group: catalog-assemble
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canbox-catalog-data
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-catalog-data
          path: canbox-catalog-data
          token: ${{ secrets.CATALOG_GITEE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org/

      - name: Assemble catalog
        run: node scripts/gitee/assemble.js --platform=gitee --data-repo-root=./canbox-catalog-data

      - name: Commit catalog
        if: success()
        run: |
          cd canbox-catalog-data
          git config user.name "gitee-ci"
          git config user.email "ci@gitee.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: assemble catalog - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push