name: Reconcile APP Labels

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canbox-catalog-data
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-catalog-data
          path: canbox-catalog-data
          token: ${{ secrets.CATALOG_GITEE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org/

      - name: Run reconciliation
        id: reconcile
        env:
          CATALOG_GITEE_TOKEN: ${{ secrets.CATALOG_GITEE_TOKEN }}
        run: |
          node scripts/gitee/reconcile.js --platform=gitee --data-repo-root=./canbox-catalog-data
          NEW_COUNT=$(cat ./canbox-catalog-data/.reconcile-result.json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).newCount))" || echo "0")
          echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: success()
        run: |
          cd canbox-catalog-data
          git config user.name "gitee-ci"
          git config user.email "ci@gitee.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: catalog reconcile - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push