name: Verify And Refresh APPs

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canbox-catalog-data
        uses: actions/checkout@v4
        with:
          repository: canbox-io/canbox-catalog-data
          path: canbox-catalog-data
          token: ${{ secrets.CATALOG_GITEE_TOKEN }}

      - name: Determine shard to verify
        id: shard
        run: |
          SHARD_INDEX=$(node -e "const d=require('./canbox-catalog-data/app_lists.json'); console.log(d.nextShardToVerify || 1)")
          echo "shard_index=$SHARD_INDEX" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org/

      - name: Verify shard
        env:
          CATALOG_GITEE_TOKEN: ${{ secrets.CATALOG_GITEE_TOKEN }}
        run: node scripts/gitee/verify.js --platform=gitee --shard=${{ steps.shard.outputs.shard_index }} --data-repo-root=./canbox-catalog-data

      - name: Commit changes
        if: success()
        run: |
          cd canbox-catalog-data
          git config user.name "gitee-ci"
          git config user.email "ci@gitee.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: catalog verify shard-${{ steps.shard.outputs.shard_index }} - $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push